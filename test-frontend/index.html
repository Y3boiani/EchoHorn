<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoHorn API Tester</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3348;
      --accent: #6c63ff;
      --accent2: #4ecdc4;
      --success: #43d08a;
      --error: #ff5c5c;
      --warn: #f7c948;
      --text: #e4e6f1;
      --muted: #7c809a;
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
    }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
    header span { font-size: 12px; color: var(--muted); background: var(--surface2); padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); }
    #auth-status {
      margin-left: auto;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    #auth-status.logged-in { border-color: var(--success); color: var(--success); }
    .layout { display: flex; flex: 1; height: calc(100vh - 57px); }
    nav {
      width: 220px;
      min-width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px 0;
    }
    nav .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      padding: 12px 16px 6px;
    }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 9px 16px;
      font-size: 13px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all .15s;
    }
    nav button:hover { color: var(--text); background: var(--surface2); }
    nav button.active { color: var(--accent); border-left-color: var(--accent); background: rgba(108,99,255,.08); }
    nav .method-badge {
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 6px;
      font-weight: 600;
    }
    .GET { background: rgba(78,205,196,.15); color: var(--accent2); }
    .POST { background: rgba(67,208,138,.15); color: var(--success); }
    .PATCH, .PUT { background: rgba(247,201,72,.15); color: var(--warn); }
    .DELETE { background: rgba(255,92,92,.15); color: var(--error); }

    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .pane-top { flex: 1; overflow-y: auto; padding: 20px; }
    .pane-bottom {
      min-height: 220px;
      max-height: 40%;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .pane-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
    }
    .pane-tabs button {
      padding: 10px 16px;
      font-size: 12px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: -1px;
    }
    .pane-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
    .response-body {
      flex: 1;
      overflow: auto;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .status-bar {
      padding: 4px 16px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 16px;
    }
    .status-bar .ok { color: var(--success); }
    .status-bar .err { color: var(--error); }

    /* Form area */
    .endpoint-header { margin-bottom: 16px; }
    .endpoint-header h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .endpoint-header .url-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
    }
    .endpoint-header .url-bar .method { font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .endpoint-header .url-bar .path { font-size: 13px; font-family: 'JetBrains Mono', monospace; color: var(--muted); flex: 1; }
    .endpoint-header p { font-size: 12px; color: var(--muted); margin-top: 6px; }

    .field-group { margin-bottom: 14px; }
    .field-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
    .field-group input, .field-group select, .field-group textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      font-family: var(--font);
      padding: 8px 10px;
      outline: none;
      transition: border-color .15s;
    }
    .field-group input:focus, .field-group select:focus, .field-group textarea:focus {
      border-color: var(--accent);
    }
    .field-group textarea { resize: vertical; min-height: 80px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    .btn {
      padding: 9px 20px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #7c74ff; }
    .btn-primary:active { transform: scale(.97); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: rgba(255,92,92,.15); color: var(--error); border: 1px solid rgba(255,92,92,.3); }

    .token-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
      margin-bottom: 12px;
    }
    .token-box strong { color: var(--accent2); display: block; margin-bottom: 4px; font-family: var(--font); font-size: 11px; }
    .note { background: rgba(108,99,255,.08); border: 1px solid rgba(108,99,255,.25); border-radius: 6px; padding: 10px 12px; font-size: 12px; color: var(--accent); margin-bottom: 12px; }
    .note strong { display: block; margin-bottom: 2px; }
    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    .section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

    .json-key { color: #9d79d6; }
    .json-str { color: #98c379; }
    .json-num { color: #d19a66; }
    .json-bool { color: #56b6c2; }
    .json-null { color: var(--muted); }
  </style>
</head>
<body>

<header>
  <h1>🔊 EchoHorn</h1>
  <span>API Tester</span>
  <div id="auth-status">Not logged in</div>
  <button class="btn btn-danger" id="clear-token-btn" onclick="clearToken()" style="padding:5px 12px; font-size:12px; display:none">Logout</button>
</header>

<div class="layout">

    <button onclick="show('login')" id="nav-login"><span class="method-badge POST">POST</span>Login</button>
    <button onclick="show('token-refresh')" id="nav-token-refresh"><span class="method-badge POST">POST</span>Token Refresh</button>
    <button onclick="show('me')" id="nav-me"><span class="method-badge GET">GET</span>Me (Profile)</button>
    <button onclick="show('me-update')" id="nav-me-update"><span class="method-badge PATCH">PATCH</span>Update Profile</button>

    <div class="section-label">Contractor — Vehicles</div>
    <button onclick="show('vehicle-list')" id="nav-vehicle-list"><span class="method-badge GET">GET</span>List Vehicles</button>
    <button onclick="show('vehicle-create')" id="nav-vehicle-create"><span class="method-badge POST">POST</span>Create Vehicle</button>
    <button onclick="show('vehicle-detail')" id="nav-vehicle-detail"><span class="method-badge GET">GET</span>Vehicle Detail</button>
    <button onclick="show('vehicle-update')" id="nav-vehicle-update"><span class="method-badge PATCH">PATCH</span>Update Vehicle</button>

    <button onclick="show('request-create')" id="nav-request-create"><span class="method-badge POST">POST</span>Create Service Request</button>
    <button onclick="show('request-list')" id="nav-request-list"><span class="method-badge GET">GET</span>List My Requests</button>
    <button onclick="show('request-detail')" id="nav-request-detail"><span class="method-badge GET">GET</span>Request Detail</button>
    <button onclick="show('available-drivers')" id="nav-available-drivers"><span class="method-badge GET">GET</span>Available Drivers</button>

    <div class="section-label">Consumer — Bookings</div>
    <button onclick="show('booking-create')" id="nav-booking-create"><span class="method-badge POST">POST</span>Create Booking</button>
    <button onclick="show('booking-list')" id="nav-booking-list"><span class="method-badge GET">GET</span>List Bookings</button>
    <button onclick="show('booking-detail')" id="nav-booking-detail"><span class="method-badge GET">GET</span>Booking Detail</button>
    <button onclick="show('pay-advance')" id="nav-pay-advance"><span class="method-badge POST">POST</span>Pay Advance</button>
    <button onclick="show('pay-full')" id="nav-pay-full"><span class="method-badge POST">POST</span>Pay Full</button>
    <button onclick="show('rating-create')" id="nav-rating-create"><span class="method-badge POST">POST</span>Create Rating</button>
  </nav>

  <main>
    <div class="pane-top" id="pane-top">
      <!-- Content injected by JS -->
    </div>
    <div class="pane-bottom">
      <div class="pane-tabs">
        <button class="active" onclick="switchTab('response')">Response</button>
        <button onclick="switchTab('headers')">Headers</button>
      </div>
      <div class="response-body" id="response-area">Hit <strong style="color:var(--accent)">Send</strong> to see the response here.</div>
      <div class="status-bar" id="status-bar">
        <span id="status-code">—</span>
        <span id="status-time">—</span>
        <span id="status-size">—</span>
      </div>
    </div>
  </main>
</div>

<script>
const BASE = 'http://127.0.0.1:8000/api';
let token = localStorage.getItem('echoaccess') || '';
let refreshToken = localStorage.getItem('echorefresh') || '';
let responseHeaders = {};

function updateAuthStatus() {
  const el = document.getElementById('auth-status');
  const btn = document.getElementById('clear-token-btn');
  if (token) {
    el.textContent = '🔐 Authenticated';
    el.className = 'logged-in';
    btn.style.display = '';
  } else {
    el.textContent = 'Not logged in';
    el.className = '';
    btn.style.display = 'none';
  }
}
updateAuthStatus();

function clearToken() {
  token = ''; refreshToken = '';
  localStorage.removeItem('echoaccess');
  localStorage.removeItem('echorefresh');
  updateAuthStatus();
  setResponse({ detail: 'Logged out — token cleared.' }, 200, 0, '{}');
}

function switchTab(tab) {
  document.querySelectorAll('.pane-tabs button').forEach((b,i) => b.classList.toggle('active', i === (tab==='response'?0:1)));
  if (tab === 'response') {
    document.getElementById('response-area').dataset.mode = 'body';
  } else {
    const el = document.getElementById('response-area');
    el.dataset.mode = 'headers';
    el.innerHTML = syntaxHighlight(JSON.stringify(responseHeaders, null, 2));
  }
}

function show(id) {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  const navBtn = document.getElementById('nav-' + id);
  if (navBtn) navBtn.classList.add('active');
  const pane = document.getElementById('pane-top');
  pane.innerHTML = pages[id] || '<p style="color:var(--muted);padding:20px">No content.</p>';
}

async function send(method, path, bodyObj, isFormData) {
  const url = BASE + path;
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const opts = { method, headers };
  if (bodyObj && method !== 'GET') {
    opts.body = isFormData ? JSON.stringify(bodyObj) : JSON.stringify(bodyObj);
  }
  const t0 = performance.now();
  try {
    const res = await fetch(url, opts);
    const elapsed = Math.round(performance.now() - t0);
    responseHeaders = {};
    res.headers.forEach((v, k) => responseHeaders[k] = v);
    let text = await res.text();
    let parsed;
    try { parsed = JSON.parse(text); } catch { parsed = text; }
    setResponse(parsed, res.status, elapsed, text);
    return parsed;
  } catch (e) {
    setResponse({ error: e.message }, 0, 0, '');
    return null;
  }
}

function setResponse(data, status, ms, raw) {
  const area = document.getElementById('response-area');
  if (typeof data === 'object') {
    area.innerHTML = syntaxHighlight(JSON.stringify(data, null, 2));
  } else {
    area.textContent = data || raw;
  }
  area.dataset.mode = 'body';
  area.dataset.raw = raw;
  const sc = document.getElementById('status-code');
  sc.textContent = status ? `Status: ${status}` : 'Network Error';
  sc.className = status >= 200 && status < 300 ? 'ok' : 'err';
  document.getElementById('status-time').textContent = ms ? `${ms}ms` : '';
  document.getElementById('status-size').textContent = raw ? `${raw.length} bytes` : '';
  document.querySelectorAll('.pane-tabs button').forEach((b,i) => b.classList.toggle('active', i===0));
}

function syntaxHighlight(json) {
  return json
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
      let cls = 'json-num';
      if (/^"/.test(match)) cls = /:$/.test(match) ? 'json-key' : 'json-str';
      else if (/true|false/.test(match)) cls = 'json-bool';
      else if (/null/.test(match)) cls = 'json-null';
      return `<span class="${cls}">${match}</span>`;
    });
}

function v(id) { return (document.getElementById(id)||{}).value || ''; }

// ─── PAGE DEFINITIONS ───────────────────────────────────────────────────────
const pages = {

<div class="field-group"><label>Phone (optional, e.g. +919999999999)</label><input id="rc-phone" value=""/></div>
<div class="field-row">
  <div class="field-group"><label>Password</label><input id="rc-pass" type="password" value="TestPass@123"/></div>
  <div class="field-group"><label>Confirm Password</label><input id="rc-pass2" type="password" value="TestPass@123"/></div>

<button class="btn btn-primary" onclick="doRegisterConsumer()">Send →</button>`,

function authNote() {
  return `<div class="note"><strong>🔐 Requires Authentication</strong>Login first to set the Bearer token, or paste your token in the Login page.</div>`;
}
function tokenDisplay() {
  return `<div class="divider"></div>
<div class="section-title">Stored Token</div>
<div class="token-box" id="token-display"><strong>Access Token</strong>${token || 'None — login first'}</div>`;
}

// ── HANDLERS ──────────────────────────────────────────────────────────────
async function doRegisterConsumer() {
  const body = { first_name:v('rc-first'), last_name:v('rc-last'), email:v('rc-email'), password:v('rc-pass'), password2:v('rc-pass2'), user_type:'consumer' };
  if (v('rc-phone')) body.phone_number = v('rc-phone');
  await send('POST', '/auth/register/consumer/', body);
}
async function doRegisterContractor() {
  const body = { first_name:v('rco-first'), last_name:v('rco-last'), email:v('rco-email'), password:v('rco-pass'), password2:v('rco-pass2'), user_type:'contractor' };
  if (v('rco-phone')) body.phone_number = v('rco-phone');
  await send('POST', '/auth/register/contractor/', body);
}
async function doLogin() {
  const data = await send('POST', '/auth/login/', { email: v('li-email'), password: v('li-pass') });
  if (data && data.access) {
    token = data.access;
    refreshToken = data.refresh;
    localStorage.setItem('echoaccess', token);
    localStorage.setItem('echorefresh', refreshToken);
    updateAuthStatus();
    // Refresh page content to show new token
    show('login');
  }
}
async function doTokenRefresh() {
  const data = await send('POST', '/auth/token/refresh/', { refresh: v('tr-refresh') });
  if (data && data.access) {
    token = data.access;
    localStorage.setItem('echoaccess', token);
    updateAuthStatus();
  }
}
async function doMe() { await send('GET', '/auth/me/'); }
async function doMeUpdate() {
  const body = {};
  if (v('mu-first')) body.first_name = v('mu-first');
  if (v('mu-last')) body.last_name = v('mu-last');
  if (v('mu-phone')) body.phone_number = v('mu-phone');
  await send('PATCH', '/auth/me/', body);
}
async function doContractorProfile() {
  const body = { contractor_type: v('cp-type'), business_address: v('cp-addr'), city: v('cp-city'), state: v('cp-state'), pincode: v('cp-pin') };
  if (v('cp-company')) body.company_name = v('cp-company');
  if (v('cp-gst')) body.gst_number = v('cp-gst');
  if (v('cp-reg')) body.company_registration_number = v('cp-reg');
  await send('POST', '/auth/contractor/complete-profile/', body);
}
async function doVehicleCreate() {
  const body = { registration_number: v('vc-reg'), vehicle_type: v('vc-type'), model_make: v('vc-model'), fuel_type: v('vc-fuel'), capacity_weight: v('vc-cap') };
  if (v('vc-gps')) body.gps_device_id = v('vc-gps');
  if (v('vc-len')) body.length_feet = v('vc-len');
  if (v('vc-wid')) body.width_feet = v('vc-wid');
  if (v('vc-hei')) body.height_feet = v('vc-hei');
  await send('POST', '/contractor/vehicles/', body);
}
async function doVehicleUpdate() {
  const body = { status: v('vu-status') };
  if (v('vu-loc')) body.current_location = v('vu-loc');
  if (v('vu-odo')) body.odometer_reading = parseInt(v('vu-odo'));
  await send('PATCH', '/contractor/vehicles/' + v('vu-id') + '/', body);
}
async function doRequestCreate() {
  const body = {
    service_type: v('sr-stype'), vehicle_type_preference: v('sr-vtype'),
    cargo_type: v('sr-ctype'), cargo_weight: v('sr-cw'),
    pickup_address: v('sr-pu'), drop_address: v('sr-dr'),
    pickup_floor_number: parseInt(v('sr-pf')) || 0,
    drop_floor_number: parseInt(v('sr-df')) || 0,
    pickup_datetime: v('sr-dt'), special_notes: v('sr-notes')
  };
  await send('POST', '/consumer/requests/', body);
}
async function doBookingCreate() {
  const body = {
    service_request: parseInt(v('bc-sr')), driver: parseInt(v('bc-dr')),
    contractor: parseInt(v('bc-co')), vehicle: parseInt(v('bc-ve')),
    final_price: v('bc-fp')
  };
  await send('POST', '/consumer/bookings/', body);
}
async function doRatingCreate() {
  const body = { booking: parseInt(v('rat-bk')), rated_user: parseInt(v('rat-ru')), rating: parseInt(v('rat-r')), review: v('rat-rev') };
  await send('POST', '/consumer/ratings/', body);
}
